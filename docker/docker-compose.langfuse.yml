x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:${LANGFUSE_HOST_PORT:-50402}}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-postgres}:${LANGFUSE_POSTGRES_PASSWORD:?Langfuse PostgreSQL password required}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:-postgres}
  SALT: ${LANGFUSE_SALT:?Langfuse salt required}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Langfuse 64-hex encryption key required}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Langfuse ClickHouse password required}
  CLICKHOUSE_CLUSTER_ENABLED: ${LANGFUSE_CLICKHOUSE_CLUSTER_ENABLED:-false}
  LANGFUSE_USE_AZURE_BLOB: ${LANGFUSE_USE_AZURE_BLOB:-false}
  LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: ${LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE:-false}
  LANGFUSE_OCI_AUTH_TYPE: ${LANGFUSE_OCI_AUTH_TYPE:-workload_identity}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Langfuse MinIO password required}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Langfuse MinIO password required}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://localhost:${LANGFUSE_MINIO_HOST_PORT:-50403}}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: ${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}
  LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_REGION:-auto}
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT:-http://localhost:${LANGFUSE_MINIO_HOST_PORT:-50403}}
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Langfuse MinIO password required}
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: ${LANGFUSE_INGESTION_QUEUE_DELAY_MS:-}
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: ${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS:-}
  REDIS_HOST: langfuse-redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Langfuse Redis password required}
  REDIS_TLS_ENABLED: ${LANGFUSE_REDIS_TLS_ENABLED:-false}
  REDIS_TLS_CA: ${LANGFUSE_REDIS_TLS_CA:-/certs/ca.crt}
  REDIS_TLS_CERT: ${LANGFUSE_REDIS_TLS_CERT:-/certs/redis.crt}
  REDIS_TLS_KEY: ${LANGFUSE_REDIS_TLS_KEY:-/certs/redis.key}
  EMAIL_FROM_ADDRESS: ${LANGFUSE_EMAIL_FROM_ADDRESS:-}
  SMTP_CONNECTION_URL: ${LANGFUSE_SMTP_CONNECTION_URL:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-acceptance-labels: &acceptance-labels
  io.agentgov.acceptance-run-id: ${AGENT_GOV_ACCEPTANCE_RUN_ID:-unmanaged}

services:
  langfuse-volume-init:
    profiles: ["langfuse-maintenance"]
    image: ${LANGFUSE_POSTGRES_IMAGE:-docker.io/postgres:17}
    user: "0:0"
    network_mode: "none"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for path in \
          /langfuse/postgres \
          /langfuse/clickhouse-data \
          /langfuse/clickhouse-logs \
          /langfuse/redis \
          /langfuse/minio
        do
          mkdir -p "$$path"
          chmod -R a+rwX "$$path"
        done
    volumes:
      - ${LANGFUSE_POSTGRES_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/postgres}:/langfuse/postgres
      - ${LANGFUSE_CLICKHOUSE_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/clickhouse/data}:/langfuse/clickhouse-data
      - ${LANGFUSE_CLICKHOUSE_LOGS_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/clickhouse/logs}:/langfuse/clickhouse-logs
      - ${LANGFUSE_REDIS_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/redis}:/langfuse/redis
      - ${LANGFUSE_MINIO_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/minio}:/langfuse/minio

  langfuse-worker:
    profiles: ["langfuse"]
    image: ${LANGFUSE_WORKER_IMAGE:-docker.io/langfuse/langfuse-worker:3}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-worker
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment:
      <<: *langfuse-env

  langfuse-web:
    profiles: ["langfuse"]
    image: ${LANGFUSE_WEB_IMAGE:-docker.io/langfuse/langfuse:3}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-web
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      # 默认仅绑定 loopback；外部暴露必须由部署入口显式授权并放在 TLS 反向代理之后。
      - "${LANGFUSE_BIND_IP:-127.0.0.1}:${LANGFUSE_HOST_PORT:-50402}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Langfuse NextAuth secret required}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-agent-gov}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-AgentGov}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agent-gov}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-AgentGov}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  langfuse-clickhouse:
    profiles: ["langfuse"]
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:24.3}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-clickhouse
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    user: "101:101"
    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Langfuse ClickHouse password required}
    volumes:
      - ${LANGFUSE_CLICKHOUSE_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/clickhouse/data}:/var/lib/clickhouse
      - ${LANGFUSE_CLICKHOUSE_LOGS_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/clickhouse/logs}:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    profiles: ["langfuse"]
    image: ${LANGFUSE_MINIO_IMAGE:-cgr.dev/chainguard/minio}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-minio
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Langfuse MinIO password required}
      HOME: ${LANGFUSE_MINIO_HOME:-/data}
    ports:
      - "${LANGFUSE_BIND_IP:-127.0.0.1}:${LANGFUSE_MINIO_HOST_PORT:-50403}:9000"
      - "${LANGFUSE_BIND_IP:-127.0.0.1}:${LANGFUSE_MINIO_CONSOLE_HOST_PORT:-50404}:9001"
    volumes:
      - ${LANGFUSE_MINIO_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/minio}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    profiles: ["langfuse"]
    image: ${LANGFUSE_REDIS_IMAGE:-docker.io/redis:7}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-redis
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:?Langfuse Redis password required}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Langfuse Redis password required}
    volumes:
      - ${LANGFUSE_REDIS_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    profiles: ["langfuse"]
    image: ${LANGFUSE_POSTGRES_IMAGE:-docker.io/postgres:17}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-langfuse-postgres
    labels: *acceptance-labels
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Langfuse PostgreSQL password required}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ${LANGFUSE_POSTGRES_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/langfuse/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
