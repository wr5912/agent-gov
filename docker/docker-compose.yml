# 默认日志轮转：每容器日志上限 max-file × max-size，防止任一服务（尤其 Langfuse）日志撑满磁盘；
# 显式写在 compose 内，不依赖宿主机 /etc/docker/daemon.json，保证 agent-gov 部署自洽可移植。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-acceptance-labels: &acceptance-labels
  io.agentgov.acceptance-run-id: ${AGENT_GOV_ACCEPTANCE_RUN_ID:-unmanaged}

x-runtime-bootstrap: &runtime-bootstrap
  type: bind
  source: ${RUNTIME_BOOTSTRAP_HOST_DIR:-./runtime-bootstrap}
  target: /app/docker/runtime-bootstrap
  read_only: true
  bind:
    create_host_path: false

services:
  agentscope-runtime:
    build:
      context: ..
      dockerfile: docker/agentscope-runtime.Dockerfile
      args:
        AGENT_GOV_RUNTIME_UID: ${AGENT_GOV_RUNTIME_UID:-1000}
        AGENT_GOV_RUNTIME_GID: ${AGENT_GOV_RUNTIME_GID:-1000}
        AGENT_GOV_ACCEPTANCE_RUN_ID: ${AGENT_GOV_ACCEPTANCE_RUN_ID:-unmanaged}
        AGENTGOV_SOURCE_ARTIFACT_SHA256: ${AGENTGOV_SOURCE_ARTIFACT_SHA256:-unmanaged}
    image: agent-gov-agentscope-runtime:${APP_VERSION:-dev}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-agentscope-runtime
    init: true
    user: "${AGENT_GOV_RUNTIME_UID:-1000}:${AGENT_GOV_RUNTIME_GID:-1000}"
    labels: *acceptance-labels
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENTGOV_INTERNAL_API_BASE_URL: http://agent-gov-api:8080
      AGENTGOV_RUNTIME_SHARED_SECRET: ${AGENTGOV_RUNTIME_SHARED_SECRET:?runtime shared secret required}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:?runtime model provider api key required}
      MODEL_PROVIDER_API_URL: ${MODEL_PROVIDER_API_URL:-}
      AGENTSCOPE_MODEL_TYPE: ${AGENTSCOPE_MODEL_TYPE:-openai_credential}
      AGENTSCOPE_CREDENTIAL_TYPE: ${AGENTSCOPE_CREDENTIAL_TYPE:-openai_credential}
      AGENTSCOPE_CREDENTIAL_ID: ${AGENTSCOPE_CREDENTIAL_ID:-agentgov-runtime-provider}
      AGENTGOV_RUNTIME_VERSION: ${APP_VERSION:-dev}
      AGENTSCOPE_MODEL_NAME: ${AGENTSCOPE_MODEL_NAME:-agent-gov-model}
      AGENTSCOPE_MODEL_PARAMETERS: '${AGENTSCOPE_MODEL_PARAMETERS_JSON:-{}}'
      AGENTSCOPE_RUNTIME_HOST: 0.0.0.0
      AGENTSCOPE_RUNTIME_PORT: "8090"
      AGENTSCOPE_RUNTIME_DATA_DIR: /runtime-data
      AGENTSCOPE_RUNTIME_BUSINESS_AGENTS_ROOT: /business-agents
      AGENTSCOPE_RUNTIME_CANDIDATES_ROOT: /candidate-workspaces
      AGENTSCOPE_RUNTIME_WORKSPACES_ROOT: /runtime-workspaces
      AGENTSCOPE_RUNTIME_DATABASE_URL: sqlite+aiosqlite:////runtime-data/agentscope.db
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      AGENTGOV_OTEL_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      AGENTGOV_OTEL_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      AGENTGOV_OTEL_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agent-gov-agentscope-runtime}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:58001/mcp}
      SEC_OPS_MCP_URL: ${SEC_OPS_MCP_URL:-http://host.docker.internal:58001/mcp}
      # MCP 凭据按所绑定 Harness 的 credential_refs 校验，不能阻断不使用该 MCP 的 Agent。
      SEC_OPS_MCP_TOKEN: ${SEC_OPS_MCP_TOKEN:-}
    volumes:
      - type: bind
        source: ${HOST_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/data}/business-agents
        target: /business-agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_AGENTSCOPE_RUNTIME_CANDIDATES_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/agentscope-runtime/candidates}
        target: /candidate-workspaces
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_AGENTSCOPE_RUNTIME_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/agentscope-runtime/data}
        target: /runtime-data
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_AGENTSCOPE_RUNTIME_WORKSPACES_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/agentscope-runtime/workspaces}
        target: /runtime-workspaces
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-m", "agentscope_runtime.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    cap_drop: ["ALL"]
    # Bubblewrap 在非特权容器中需要解除 Docker 默认 seccomp/AppArmor/system-path
    # 限制；仍保持 UID 1000、cap_drop ALL、no-new-privileges，禁止 privileged/SYS_ADMIN。
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    deploy:
      replicas: 1
    restart: unless-stopped
    logging: *default-logging

  agent-gov-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        AGENT_GOV_ACCEPTANCE_RUN_ID: ${AGENT_GOV_ACCEPTANCE_RUN_ID:-unmanaged}
        AGENTGOV_SOURCE_ARTIFACT_SHA256: ${AGENTGOV_SOURCE_ARTIFACT_SHA256:-unmanaged}
    image: agent-gov-api:${APP_VERSION:-dev}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-api
    labels: *acceptance-labels
    ports:
      # 单租户 operator 控制面默认仅绑定 loopback；远程部署入口会对显式外部绑定做独立 opt-in 校验。
      - "${API_BIND_IP:-127.0.0.1}:${HOST_PORT:-50400}:${API_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      API_KEY: ${API_KEY:?API key required}
      AGENTGOV_API_MODE: ${AGENTGOV_API_MODE:-open}
      AGENTGOV_ACCEPTANCE_IDENTITY: ${AGENTGOV_ACCEPTANCE_IDENTITY:-}
      AGENTGOV_ACCEPTANCE_API_KEY: ${AGENTGOV_ACCEPTANCE_API_KEY:-}
      AGENTGOV_API_GATE_STATE_FILE: ${AGENTGOV_API_GATE_STATE_FILE:-}
      HOST_PORT: ${HOST_PORT:-50400}
      RUNTIME_CONTAINER: "1"
      HOST_RUNTIME_VOLUME_ROOT: ${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}
      HOST_DATA_MOUNT: ${HOST_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/data}
      HOST_GOVERNOR_WORKSPACE_MOUNT: ${HOST_GOVERNOR_WORKSPACE_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/governor-workspace}
      AGENTSCOPE_RUNTIME_URL: http://agentscope-runtime:8090
      AGENTGOV_RUNTIME_SHARED_SECRET: ${AGENTGOV_RUNTIME_SHARED_SECRET:?runtime shared secret required}
      AGENTSCOPE_MODEL_TYPE: ${AGENTSCOPE_MODEL_TYPE:-openai_credential}
      AGENTSCOPE_CREDENTIAL_TYPE: ${AGENTSCOPE_CREDENTIAL_TYPE:-openai_credential}
      AGENTSCOPE_CREDENTIAL_ID: ${AGENTSCOPE_CREDENTIAL_ID:-agentgov-runtime-provider}
      AGENTSCOPE_MODEL_NAME: ${AGENTSCOPE_MODEL_NAME:-agent-gov-model}
      AGENTSCOPE_MODEL_PARAMETERS_JSON: '${AGENTSCOPE_MODEL_PARAMETERS_JSON:-{}}'
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      RUNTIME_CANDIDATES_DIR: /candidate-workspaces
      AGENT_GIT_SERVICE_PROVIDER: ${AGENT_GIT_SERVICE_PROVIDER:-local}
      AGENT_GIT_SERVICE_URL: ${AGENT_GIT_SERVICE_URL:-}
      AGENT_GIT_SERVICE_PUBLIC_URL: ${AGENT_GIT_SERVICE_PUBLIC_URL:-}
      AGENT_GIT_REPOSITORY_NAME: ${AGENT_GIT_REPOSITORY_NAME:-security-operations-expert-config}
      AGENT_GIT_WORKTREES_DIR: ${AGENT_GIT_WORKTREES_DIR:-/data/business-agents/security-operations-expert/version/worktrees}
      AGENT_RELEASE_ARCHIVES_DIR: ${AGENT_RELEASE_ARCHIVES_DIR:-/data/business-agents/security-operations-expert/version/releases}
      GOVERNOR_WORKSPACE_DIR: ${GOVERNOR_WORKSPACE_DIR:-/governor-workspace}
      DATA_DIR: ${DATA_DIR:-/data}
      GOVERNANCE_AGENT_TIMEOUT_SECONDS: ${GOVERNANCE_AGENT_TIMEOUT_SECONDS:-300}
      AGENT_TEST_RUN_TIMEOUT_SECONDS: ${AGENT_TEST_RUN_TIMEOUT_SECONDS:-1800}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
    volumes:
      - *runtime-bootstrap
      - ${HOST_GOVERNOR_WORKSPACE_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/governor-workspace}:${GOVERNOR_WORKSPACE_DIR:-/governor-workspace}
      - ${HOST_DATA_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/data}:${DATA_DIR:-/data}
      - type: bind
        source: ${HOST_AGENTSCOPE_RUNTIME_CANDIDATES_MOUNT:-${HOST_RUNTIME_VOLUME_ROOT:-${HOME}/volume-agent-gov}/agentscope-runtime/candidates}
        target: /candidate-workspaces
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENTGOV_API_GATE_STATE_DIR_HOST:-./api-gate}
        target: /run/agentgov/api-gate
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://127.0.0.1:${API_PORT:-8080}/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      agentscope-runtime:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  agent-gov-ui:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        AGENT_GOV_ACCEPTANCE_RUN_ID: ${AGENT_GOV_ACCEPTANCE_RUN_ID:-unmanaged}
        AGENTGOV_SOURCE_ARTIFACT_SHA256: ${AGENTGOV_SOURCE_ARTIFACT_SHA256:-unmanaged}
    image: agent-gov-ui:${APP_VERSION:-dev}
    container_name: ${CONTAINER_NAME_PREFIX:-agent-gov}-ui
    labels: *acceptance-labels
    ports:
      # UI 内含 operator API token，不是多用户认证边界；默认仅允许宿主机访问。
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_HOST_PORT:-50401}:${FRONTEND_PORT:-5173}"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_RUNTIME_API_BASE: ${FRONTEND_RUNTIME_API_BASE:-http://localhost:${HOST_PORT:-50400}}
      VITE_RUNTIME_API_KEY: ${FRONTEND_RUNTIME_API_KEY:-${API_KEY:-}}
      VITE_LANGFUSE_URL: ${FRONTEND_LANGFUSE_URL:-${LANGFUSE_NEXTAUTH_URL:-http://localhost:${LANGFUSE_HOST_PORT:-50402}}}
      VITE_LANGFUSE_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agent-gov}
      VITE_GOVERNANCE_AGENT_TIMEOUT_SECONDS: ${GOVERNANCE_AGENT_TIMEOUT_SECONDS:-300}
      VITE_DEV_PROXY_TARGET: http://agent-gov-api:${API_PORT:-8080}
      COREPACK_NPM_REGISTRY: https://registry.npmmirror.com
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    depends_on:
      agent-gov-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
