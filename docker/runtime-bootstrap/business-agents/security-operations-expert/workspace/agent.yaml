schema_version: 1
agent:
  id: security-operations-expert
  name: 网络安全运营专家智能体
  version: 0.1.0
  language: zh-CN
  runtime: agentscope
  runtime_contract: agentscope-app/2.0.8
  profile: security-operations-expert
  system_prompt: AGENT.md
  requires_web_hitl: false
context_config: {}
react_config: {}
invite_config:
  invitable: false
session:
  model_profile: default
  permission_mode: default
  cwd: .
workspace_policy:
  owner: agentgov
  isolation: per_agent
  immutable_harness: true
  fail_closed: true
  allow_for_run: false
  allowed_tools:
  - AgentCreate
  - Bash(date *)
  - Bash(date)
  - Bash(jq *)
  - Bash(mkdir -p /workspace/outputs/security-operations-expert/**)
  - Bash(pwd)
  - Edit(/workspace/outputs/security-operations-expert/**)
  - Glob
  - Grep
  - Read(./**)
  - Read(/workspace/data/**)
  - Read(/workspace/outputs/security-operations-expert/**)
  - Skill
  - TeamCreate
  - TeamDelete
  - TeamSay
  - Write(/workspace/outputs/security-operations-expert/**)
  - mcp__sec-ops__resource_read
  - mcp__sec-ops__resource_templates_list
  - mcp__sec-ops__resources_list
  - mcp__sec-ops__response_orchestration_agent_tools__get_case_revision_context_api_v1_agent_tools_cases_case_id_context_get
  - mcp__sec-ops__response_orchestration_agent_tools__request_case_revision_api_v1_agent_tools_cases_case_id_revisions_post
  - mcp__sec-ops__soc_api__dashboard_summary_api_v1_dashboard_summary_get
  - mcp__sec-ops__soc_api__get_resp_playbooks_recommend
  - mcp__sec-ops__soc_api__list_alerts_api_v1_alerts_get
  - mcp__sec-ops__soc_api__list_assets_api_v1_assets_get
  - mcp__sec-ops__soc_api__list_detection_findings_api_external_detection_findings_get
  - mcp__sec-ops__soc_api__list_events_api_v1_events_get
  - mcp__sec-ops__soc_api__list_incidents_api_v1_incidents_get
  - mcp__sec-ops__soc_api__list_indicators_api_v1_indicators_get
  - mcp__sec-ops__soc_api__list_vulnerabilities_api_v1_vulnerabilities_get
  denied_tools:
  - AskUserQuestion
  - Bash(:(){ :|:& };:*)
  - Bash(curl *)
  - Bash(curl *|sh*)
  - Bash(http *)
  - Bash(httpie *)
  - Bash(nc *)
  - Bash(ncat *)
  - Bash(rm -rf /)
  - Bash(rm -rf /*)
  - Bash(socat *)
  - Bash(wget *)
  - Bash(wget *|sh*)
  - Edit(./AGENT.md)
  - Edit(./agent.yaml)
  - Edit(./mcp/*.json)
  - Edit(./skills/**)
  - Edit(./subagents/**)
  - NotebookEdit(./AGENT.md)
  - NotebookEdit(./agent.yaml)
  - NotebookEdit(./mcp/*.json)
  - NotebookEdit(./skills/**)
  - NotebookEdit(./subagents/**)
  - Read(./.env)
  - Read(./.env.*)
  - Read(./secrets/**)
  - Write(./AGENT.md)
  - Write(./agent.yaml)
  - Write(./mcp/*.json)
  - Write(./skills/**)
  - Write(./subagents/**)
  - mcp__sec-ops__soc_api__cancel*
  - mcp__sec-ops__soc_api__create*
  - mcp__sec-ops__soc_api__create_1
  - mcp__sec-ops__soc_api__delete*
  - mcp__sec-ops__soc_api__delete_*
  - mcp__sec-ops__soc_api__execute
  - mcp__sec-ops__soc_api__manual
  - mcp__sec-ops__soc_api__patch_*
  - mcp__sec-ops__soc_api__post_*
  - mcp__sec-ops__soc_api__put_*
  - mcp__sec-ops__soc_api__rollback
  - mcp__sec-ops__soc_api__update*
  - mcp__sec-ops__soc_api__upload*
  immutable_paths:
  - AGENT.md
  - agent.yaml
  - skills/**
  - mcp/**
  - subagents/**
  writable_paths:
  - /workspace/outputs/security-operations-expert
  denied_read_paths:
  - ./.env
  - ./secrets
  allowed_network_domains:
  - ${SEC_OPS_MCP_URL}
  sandbox:
    enabled: true
    fail_if_unavailable: true
    allow_unsandboxed_commands: false
  guard:
    implementation: agentgov_runtime_middleware
    mode: deny_only
    denied_command_families:
    - destructive_filesystem
    - direct_production_mutation
    - remote_installer_pipe
    - network_scanning
runtime_middlewares:
- type: policy_guard
  phase: before_tool_call
  fail_closed: true
- type: tool_audit
  phase: after_tool_call
  sink: /runtime-data/transcripts/agentscope-tool-audit.jsonl
  async: true
- type: system_prompt_context
  source: AGENT.md
paths:
  workspace: /workspace
  data_root: /workspace/data
  sessions: /workspace/data/sessions
  transcripts: /workspace/data/transcripts
  uploads: /workspace/data
  outputs: /workspace/outputs
  agent_memory: /workspace/data/agent-memory
harness:
